version: '3.8'

services:
  angular-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - NODE_VERSION=${NODE_VERSION:-18}
        - ANGULAR_CLI_VERSION=${ANGULAR_CLI_VERSION:-latest}
    container_name: ${PROJECT_NAME:-angular-app}-dev
    volumes:
      - ./app:/app                    # Монтируем папку с Angular проектом
      - node_modules:/app/node_modules # Изолируем node_modules в volume
      - /app/dist                     # Изолируем папку сборки
    working_dir: /app
    ports:
      - "${HOST_PORT:-4200}:4200"     # Dev server
      - "9876:9876"                   # Karma test runner
      - "9229:9229"                   # Node.js debug port
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true      # Для работы hot-reload в Docker
      - NG_CLI_ANALYTICS=ci           # Отключаем аналитику Angular CLI
    stdin_open: true
    tty: true
    command: npm start -- --host 0.0.0.0 --poll 1000 --disable-host-check

volumes:
  node_modules:                       # Persistent volume для node_modules